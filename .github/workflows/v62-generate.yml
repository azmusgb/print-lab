name: Generate v62 rim-tab candidate

on:
  push:
    branches:
      - feat/v62-rim-tabs
    paths:
      - projects/hex-tile/sources/scad/make_v62_rim_tabs.py
      - tests/test_v62_rim_tabs.py
      - .github/workflows/v62-generate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Print Lab
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Test v62 geometry against the real tracked v60b125 source
        run: pytest -q tests/test_v62_rim_tabs.py

      - name: Generate candidate 3MF
        run: |
          python projects/hex-tile/sources/scad/make_v62_rim_tabs.py \
            projects/hex-tile/sources/hexagon_v60b125_X2D_0.6nozzle.3mf \
            projects/hex-tile/sources/hexagon_v62r_X2D_0.6nozzle.3mf

      - name: Verify archive and show checksum
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p = Path('projects/hex-tile/sources/hexagon_v62r_X2D_0.6nozzle.3mf')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert '3D/3dmodel.model' in z.namelist()
          print('sha256', hashlib.sha256(p.read_bytes()).hexdigest())
          print('bytes', p.stat().st_size)
          PY

      - name: Upload generated candidate
        uses: actions/upload-artifact@v4
        with:
          name: hexagon-v62r-candidate
          path: projects/hex-tile/sources/hexagon_v62r_X2D_0.6nozzle.3mf
          if-no-files-found: error

      - name: Commit generated candidate to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/hex-tile/sources/hexagon_v62r_X2D_0.6nozzle.3mf
          if git diff --cached --quiet; then
            echo 'Candidate already current.'
          else
            git commit -m 'Generate v62r rim-tab candidate [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi

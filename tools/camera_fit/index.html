<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Camera carrier fit</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #5d5b55; --line: #d9d6cf; --accent: #1f5fbf;
  --ok: #1d6b3a; --warn: #8a5a00; --bad: #a3261a; --warn-bg: #fff4dc; --bad-bg: #fde8e5;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a099; --line: #3a3935; --accent: #7fb0ff;
    --ok: #6fcf93; --warn: #f0c36a; --bad: #ff8d80; --warn-bg: #3a2f14; --bad-bg: #3d1f1b; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-inline-size: 40rem; margin-inline: auto; }
h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
p { margin: 0; }
.muted { color: var(--muted); font-size: .875rem; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: .75rem; }
.shot { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; background: #2b3042; }
.shot img { inline-size: 100%; block-size: 100%; object-fit: contain; display: block; }
.shot .msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; color: #fff; background: rgb(0 0 0 / .45); }
.shot .msg[hidden] { display: none; }
.views { display: flex; gap: 0; border-top: 1px solid var(--line); }
.views button { flex: 1; min-block-size: 44px; border: 0; border-inline-end: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; }
.views button:last-child { border-inline-end: 0; }
.views button[aria-pressed="true"] { background: var(--accent); color: #fff; }
button, input { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.banner { margin-top: .75rem; padding: .625rem .75rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.banner.warn { background: var(--warn-bg); border-color: var(--warn); }
.banner.bad { background: var(--bad-bg); border-color: var(--bad); }
.banner[hidden] { display: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .75rem; margin-bottom: .625rem; }
.card[data-changed="true"] { border-color: var(--accent); }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.row { display: grid; grid-template-columns: 44px 1fr 44px; gap: .5rem; align-items: center; margin-top: .5rem; }
.row button { min-block-size: 44px; min-inline-size: 44px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); font-size: 1.25rem; }
.row input[type=range] { inline-size: 100%; min-block-size: 44px; accent-color: var(--accent); }
.val { display: flex; align-items: center; gap: .5rem; margin-top: .25rem; }
.val input { inline-size: 6.5rem; min-block-size: 44px; padding: 0 .5rem; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
.val input[aria-invalid="true"] { border-color: var(--bad); }
.val .back { margin-inline-start: auto; min-block-size: 44px; padding: 0 .75rem; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); }
.val .back[disabled] { opacity: .45; }
.err { color: var(--bad); font-size: .875rem; margin-top: .25rem; min-block-size: 1.2em; }
.card[aria-busy="true"] { opacity: .65; }
details { margin-top: 1rem; }
summary { min-block-size: 44px; display: flex; align-items: center; }
table { inline-size: 100%; border-collapse: collapse; font-size: .875rem; }
td { padding: .25rem 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
td:last-child { text-align: end; padding-inline-start: .5rem; }
.steps { display: flex; gap: .375rem; overflow-x: auto; padding: .5rem 0; scrollbar-width: thin; }
.steps button { flex: none; min-block-size: 44px; padding: 0 .75rem; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); white-space: nowrap; }
.steps button[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .5rem; }
.nav button { min-block-size: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.nav button[disabled] { opacity: .45; }
.facts { margin: .75rem 0; }
.facts dl { display: grid; grid-template-columns: auto 1fr; gap: .125rem .75rem; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: end; overflow-wrap: anywhere; }
.check { display: flex; align-items: center; gap: .5rem; min-block-size: 44px; }
.check input { inline-size: 1.25rem; block-size: 1.25rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Camera carrier fit</h1>
  <p class="muted" id="doc">Reading the Fusion model…</p>

  <div class="banner" id="banner" role="status" hidden></div>

  <h2 id="wt-title">Walkthrough</h2>
  <div class="steps" id="steps" role="group" aria-label="Components"></div>
  <section class="stage" aria-label="Model view">
    <div class="shot">
      <img id="img" alt="The camera carrier model as Fusion shows it" hidden>
      <div class="msg" id="shotmsg" role="status">Loading the view…</div>
    </div>
    <div class="views" role="group" aria-label="View">
      <button type="button" data-view="iso" aria-pressed="true">Iso</button>
      <button type="button" data-view="front" aria-pressed="false">Front</button>
      <button type="button" data-view="top" aria-pressed="false">Top</button>
      <button type="button" data-view="right" aria-pressed="false">Right</button>
      <button type="button" data-view="back" aria-pressed="false">Back</button>
    </div>
  </section>
  <p class="muted" style="margin-top:.5rem">The view is Fusion's own picture. Choosing one changes the camera angle in Fusion on the Mac. Nothing here saves the Fusion document.</p>

  <div class="nav"><button type="button" id="prev">‹ Previous</button><button type="button" id="next">Next ›</button></div>
  <label class="check" id="alone-wrap"><input type="checkbox" id="alone" checked> Show this part on its own</label>
  <div class="facts" id="facts" aria-live="polite"></div>
  <div id="stepparams"></div>

  <details id="all">
    <summary>All placeholder sizes</summary>
    <div id="params"></div>
  </details>

  <details>
    <summary>Sizes worked out from these (read-only)</summary>
    <table id="derived"></table>
  </details>
</main>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
let view = "iso", shotSeq = 0, shotTimer = 0, busy = 0, step = 0, comps = [], byName = {};

async function call(path, body) {
  const url = path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN);
  const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) {
    let m = "";
    try { m = (await r.json()).error; } catch { /* not JSON */ }
    throw new Error(m || `The Mac answered ${r.status}.`);
  }
  return r;
}

function banner(status, extra) {
  const b = $("banner"), lines = [];
  if (extra) lines.push(extra);
  if (status && status.failed && status.failed.length) lines.push("Fusion reports failed steps: " + status.failed.join("; "));
  if (status && status.busy) lines.push("A command is open in Fusion, so changes will wait until it finishes.");
  b.hidden = !lines.length;
  b.className = "banner " + (status && status.failed && status.failed.length ? "bad" : "warn");
  b.textContent = lines.join(" ");
}

function shot() {
  const seq = ++shotSeq;
  $("shotmsg").hidden = false;
  $("shotmsg").textContent = "Loading the view…";
  const w = Math.min(1200, Math.round(innerWidth * (devicePixelRatio || 1)));
  call(`/api/shot?view=${view}&w=${w}&h=${Math.round(w * 0.75)}${only()}`).then((r) => r.blob()).then((blob) => {
    if (seq !== shotSeq) return;
    const old = $("img").src;
    $("img").src = URL.createObjectURL(blob);
    if (old.startsWith("blob:")) URL.revokeObjectURL(old);
    $("img").hidden = false;
    $("shotmsg").hidden = true;
  }).catch((e) => {
    if (seq !== shotSeq) return;
    $("shotmsg").hidden = false;
    $("shotmsg").textContent = e.message;
  });
}
function only() {
  const c = comps[step - 1];
  return c && $("alone").checked ? "&only=" + encodeURIComponent(c.name) : "";
}
function shotSoon() { clearTimeout(shotTimer); shotTimer = setTimeout(shot, 400); }

function num(v) { return Number.isFinite(v) ? String(Math.round(v * 100) / 100) : ""; }

function card(p) {
  const c = document.createElement("div");
  c.className = "card";
  c.dataset.name = p.name;
  c.innerHTML = `<div class="top"><span class="name"></span><span class="muted range"></span></div>
    <p class="muted why"></p>
    <div class="row"><button type="button" class="dec" aria-label="Smaller">−</button>
      <input type="range" step="0.1"><button type="button" class="inc" aria-label="Larger">+</button></div>
    <div class="val"><input type="text" inputmode="decimal" autocomplete="off" aria-label="Value in millimetres"><span class="muted">mm</span>
      <button type="button" class="back">Back to start</button></div>
    <p class="err" role="alert"></p>`;
  c.querySelector(".name").textContent = p.name;
  c.querySelector(".why").textContent = p.comment;
  const range = c.querySelector("input[type=range]"), box = c.querySelector(".val input"), err = c.querySelector(".err"), back = c.querySelector(".back");
  range.min = p.lo; range.max = p.hi; range.setAttribute("aria-label", p.name + " in millimetres");
  c.querySelector(".range").textContent = `${num(p.lo)}–${num(p.hi)} mm`;

  const show = (v) => {
    range.value = v; box.value = num(v); box.removeAttribute("aria-invalid");
    c.dataset.changed = String(Math.abs(v - p.start) > 0.004);
    back.disabled = c.dataset.changed !== "true";
  };
  show(p.value ?? p.start);
  document.addEventListener("pb-value", (e) => { if (e.detail.name === p.name && c.isConnected) show(e.detail.value); });
  const apply = async (v, reset) => {
    err.textContent = "";
    if (!Number.isFinite(v) || v < p.lo || v > p.hi) {
      box.setAttribute("aria-invalid", "true");
      err.textContent = `Use a number from ${num(p.lo)} to ${num(p.hi)}.`;
      return;
    }
    c.setAttribute("aria-busy", "true"); busy++;
    try {
      const r = await (await call(reset ? "/api/reset" : "/api/set", { name: p.name, value: v })).json();
      show(reset ? p.start : v);
      document.dispatchEvent(new CustomEvent("pb-value", { detail: { name: p.name, value: reset ? p.start : v } }));
      banner({ failed: r.failed });
      refreshFacts();
      shotSoon();
    } catch (e) {
      err.textContent = e.message;
      show(p.value ?? p.start);
    } finally {
      c.removeAttribute("aria-busy"); busy--;
    }
  };
  const commit = (v) => apply(v);
  range.addEventListener("input", () => { box.value = num(Number(range.value)); });
  range.addEventListener("change", () => commit(Number(range.value)));
  box.addEventListener("change", () => commit(Number(box.value.replace(",", "."))));
  c.querySelector(".dec").addEventListener("click", () => commit(Math.max(p.lo, Math.round((Number(box.value) - 0.1) * 100) / 100)));
  c.querySelector(".inc").addEventListener("click", () => commit(Math.min(p.hi, Math.round((Number(box.value) + 0.1) * 100) / 100)));
  back.addEventListener("click", () => apply(p.start, true));
  return c;
}

function fmt(v) { return Number.isFinite(v) ? (Math.round(v * 100) / 100).toLocaleString() : "?"; }

function renderSteps() {
  const labels = ["Whole model", ...comps.map((c) => c.label)];
  $("steps").replaceChildren(...labels.map((l, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = `${i + 1}. ${l}`;
    if (i === step) b.setAttribute("aria-current", "step");
    b.addEventListener("click", () => go(i));
    return b;
  }));
  $("prev").disabled = step === 0;
  $("next").disabled = step === labels.length - 1;
  $("steps").children[step]?.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderFacts(rebuild = true) {
  const c = comps[step - 1], f = $("facts");
  $("wt-title").textContent = c ? `Walkthrough · ${step + 1} of ${comps.length + 1}: ${c.label}` : "Walkthrough · whole model";
  $("alone-wrap").hidden = !c;
  if (!c) {
    f.textContent = comps.length ? `${comps.length} parts: ${comps.map((x) => x.label).join(", ")}. Step through them with Next.` : "No parts found in this design.";
    $("stepparams").replaceChildren();
    return;
  }
  const rows = [["Part", c.name], ["Size (x × y × z)", c.size_mm.map(fmt).join(" × ") + " mm"], ["Volume", fmt(c.volume_mm3) + " mm³"],
    ["Shown in Fusion", c.visible ? "yes" : "hidden"]];
  const dl = document.createElement("dl");
  for (const [k, v] of rows) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
  f.replaceChildren(dl);
  if (!rebuild) return;
  const host = $("stepparams");
  host.replaceChildren(...c.editable.filter((n) => byName[n]).map((n) => card(byName[n])));
  if (c.fixed.length) {
    const h = document.createElement("h2"); h.textContent = "Fixed sizes for this part";
    const t = document.createElement("table");
    for (const x of c.fixed) {
      const tr = document.createElement("tr"), a = document.createElement("td"), b = document.createElement("td");
      a.textContent = x.name; b.textContent = x.expression; a.title = x.comment || "";
      tr.append(a, b); t.append(tr);
    }
    host.append(h, t);
  }
  if (!c.editable.length && !c.fixed.length) host.textContent = "No sizes in this model are tied to this part by name.";
}

function refreshFacts() {
  call("/api/components").then((r) => r.json()).then((cs) => { comps = cs; renderFacts(false); }).catch(() => { /* keep what is shown */ });
}

function go(i) {
  step = Math.max(0, Math.min(i, comps.length));
  renderSteps(); renderFacts(); shot();
}

function load() {
  call("/api/state").then((r) => r.json()).then((s) => {
    $("doc").textContent = `${s.status.document}${s.status.unsaved ? " (unsaved in Fusion)" : ""} · ${Math.round(s.status.volume_mm3).toLocaleString()} mm³`;
    banner(s.status);
    const host = $("params");
    byName = Object.fromEntries(s.params.map((p) => [p.name, p]));
    host.replaceChildren(...s.params.map(card));
    if (!s.params.length) host.textContent = "No placeholder parameters left to change.";
    const t = $("derived");
    t.replaceChildren(...s.derived.map((d) => {
      const tr = document.createElement("tr");
      const a = document.createElement("td"), b = document.createElement("td");
      a.textContent = d.name; b.textContent = d.expression;
      tr.append(a, b);
      return tr;
    }));
    return call("/api/components").then((r) => r.json()).then((cs) => { comps = cs; step = 0; renderSteps(); renderFacts(); shot(); });
  }).catch((e) => {
    $("doc").textContent = "Couldn't read the model.";
    banner(null, e.message);
    $("shotmsg").textContent = e.message;
  });
}

document.querySelectorAll(".views button").forEach((b) => b.addEventListener("click", () => {
  view = b.dataset.view;
  document.querySelectorAll(".views button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  shot();
}));
$("prev").addEventListener("click", () => go(step - 1));
$("next").addEventListener("click", () => go(step + 1));
$("alone").addEventListener("change", shot);
addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, select") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight") go(step + 1);
  if (e.key === "ArrowLeft") go(step - 1);
});
load();
</script>
</body>
</html>
